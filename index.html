<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>품사 금고 탈출 · CHAESSAEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 지하 연구소 톤: 밝은/어두운 뷰어 모두에서 같은 분위기를 유지하도록 토큰을 어둡게 통일 */
  :root{
    --bg:#0a0e13; --panel:#141c26; --ink:#eae6dc; --muted:#8f98a6; --line:#26313f;
    --coral:#E8604C; --coral-soft:rgba(232,96,76,.15); --gold:#E9B44C; --blue:#4A90D9; --green:#5CB85C; --purple:#9B6FCE;
    --ok:#48c38a; --ok-soft:rgba(72,195,138,.14); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.15);
    --chip:#1a2431; --chip-sel:#2b2421; --shadow:0 10px 30px rgba(0,0,0,.5);
    --paper:#f3ead3; --paper-ink:#3b2f1d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e13; --panel:#141c26; --ink:#eae6dc; --muted:#8f98a6; --line:#26313f;
      --chip:#1a2431; --chip-sel:#2b2421; --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e13; --panel:#141c26; --ink:#eae6dc; --muted:#8f98a6; --line:#26313f;
    --chip:#1a2431; --chip-sel:#2b2421; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }
  /* 조명 효과 */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 55% 38% at 50% -6%, rgba(233,180,76,.24), transparent 70%),
      radial-gradient(ellipse 80% 40% at 50% 115%, rgba(232,96,76,.10), transparent 60%);
    animation:flicker 7s infinite;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:40;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
  }
  @keyframes flicker{ 0%,40%,48%,76%,100%{ opacity:1; } 42%{ opacity:.55; } 44%{ opacity:1; } 46%{ opacity:.7; } 78%{ opacity:.8; } }
  .wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 16px 56px; }

  /* 상단 바 */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:rgba(10,14,19,.92); backdrop-filter:blur(6px);
    padding:10px 0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; flex-direction:column; line-height:1.15; }
  .bmark{ font-size:11px; letter-spacing:.16em; font-weight:700; color:var(--coral); }
  .btitle{ font-size:17px; font-weight:900; }
  .stats{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .pill{ background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:500; color:var(--ink); font:inherit; font-size:13px; }
  button.pill{ cursor:pointer; }
  .pill.time{ border-color:var(--gold); color:var(--gold); font-weight:700; }
  .pill.time.danger{ border-color:var(--bad); color:var(--bad); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,107,.0); } 50%{ box-shadow:0 0 14px 2px rgba(255,107,107,.55); } }

  /* 진행 표시 */
  .track{ display:flex; gap:6px; margin:16px 0 10px; }
  .node{ flex:1; text-align:center; font-size:12px; color:var(--muted); }
  .node .dot{ height:6px; border-radius:99px; background:var(--line); margin-bottom:5px; }
  .node .ic{ font-size:16px; display:block; margin-bottom:2px; filter:grayscale(1) opacity(.5); }
  .node.done{ color:var(--ok); } .node.done .dot{ background:var(--ok); } .node.done .ic{ filter:none; }
  .node.cur{ color:var(--gold); font-weight:700; } .node.cur .dot{ background:var(--gold); box-shadow:0 0 10px var(--gold); } .node.cur .ic{ filter:none; }

  /* 카드 (금고 패널) */
  .card{
    position:relative; border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:22px; margin-top:12px;
    background:
      radial-gradient(circle at 14px 14px, #46536a 3px, transparent 4px),
      radial-gradient(circle at calc(100% - 14px) 14px, #46536a 3px, transparent 4px),
      radial-gradient(circle at 14px calc(100% - 14px), #46536a 3px, transparent 4px),
      radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #46536a 3px, transparent 4px),
      linear-gradient(180deg, #172130, var(--panel));
  }
  .lock-head{ display:flex; gap:14px; align-items:center; margin-bottom:10px; }
  .lockno{ flex:none; width:48px; height:48px; border-radius:14px; background:linear-gradient(145deg,#f4cf7a,#c48a1f); color:#3a2705; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 14px rgba(233,180,76,.35); }
  h1,h2,h3{ margin:0; }
  h2{ font-size:20px; }
  .sub{ margin:2px 0 0; color:var(--muted); font-size:14px; }
  .story{ background:var(--coral-soft); border-left:3px solid var(--coral); border-radius:10px; padding:10px 14px; font-size:14px; margin:10px 0 14px; }
  .mission{ margin:10px 0 14px; font-size:15px; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .btn{ font:inherit; font-weight:700; font-size:16px; padding:12px 20px; border-radius:14px; border:1.5px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer; }
  .btn.primary{ background:var(--coral); border-color:var(--coral); color:#fff; box-shadow:0 0 18px rgba(232,96,76,.35); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }
  .spacer{ flex:1; }
  .muted{ color:var(--muted); font-size:14px; }

  .msg{ margin-top:14px; padding:10px 14px; border-radius:12px; font-size:14px; font-weight:500; }
  .msg.bad{ background:var(--bad-soft); color:var(--bad); }
  .msg.warn{ background:var(--coral-soft); color:#ff9a89; }
  .hints{ margin-top:10px; }
  .hint{ background:rgba(233,180,76,.12); border-left:3px solid var(--gold); border-radius:8px; padding:8px 12px; font-size:14px; margin-top:6px; }

  /* 쪽지 */
  .memo-wrap{ background:transparent; border:none; box-shadow:none; padding:10px 0; }
  .memo-wrap.card{ background:none; }
  .memo{
    position:relative; max-width:560px; margin:14px auto 0; padding:34px 28px 24px; transform:rotate(-1.2deg);
    background:
      repeating-linear-gradient(transparent 0 33px, rgba(90,60,20,.13) 33px 34px),
      var(--paper);
    color:var(--paper-ink); font-family:'Gaegu','Noto Sans KR',cursive; font-size:23px; line-height:34px;
    box-shadow:0 14px 34px rgba(0,0,0,.6); border-radius:4px;
    animation:memoin .5s ease both;
  }
  @keyframes memoin{ from{ opacity:0; transform:translateY(20px) rotate(-4deg); } to{ opacity:1; transform:translateY(0) rotate(-1.2deg); } }
  .memo .tape{ position:absolute; top:-12px; left:50%; width:110px; height:28px; transform:translateX(-50%) rotate(2deg); background:rgba(233,180,76,.55); }
  .memo .mtitle{ font-weight:700; font-size:20px; color:#8a4a2c; letter-spacing:.04em; }
  .memo p{ margin:0 0 4px; }
  .memo .sign{ text-align:right; font-weight:700; color:#8a4a2c; }
  .place{ text-align:center; color:var(--muted); font-size:12px; letter-spacing:.16em; }

  /* 자물쇠 SVG */
  .padwrap{ display:flex; justify-content:center; }
  .padlock{ width:120px; height:140px; overflow:visible; filter:drop-shadow(0 0 18px rgba(233,180,76,.45)); }
  .padlock .body{ transform-box:fill-box; transform-origin:center; animation:clank .32s ease both; }
  .padlock .shackle{ transform-box:view-box; transform-origin:85px 62px; animation:shackleopen .7s .32s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes clank{ 0%{ transform:translate(0,0); } 20%{ transform:translate(-3px,2px) rotate(-2deg); } 45%{ transform:translate(3px,-2px) rotate(2deg); } 70%{ transform:translate(-2px,1px); } 100%{ transform:translate(0,0); } }
  @keyframes shackleopen{ 0%{ transform:translateY(0) rotate(0); } 45%{ transform:translateY(-20px) rotate(0); } 100%{ transform:translateY(-20px) rotate(-38deg); } }
  .padlock.closed .body, .padlock.closed .shackle{ animation:none; }

  /* 글자 공개 */
  .reveal{ text-align:center; padding:22px 22px 18px; }
  .bigletter{ display:inline-flex; min-width:120px; height:120px; padding:0 20px; align-items:center; justify-content:center; font-size:64px; font-weight:900; color:#3a2705; background:linear-gradient(145deg,#f7d98a,#d69a24); border-radius:28px; box-shadow:0 0 34px rgba(233,180,76,.55); animation:pop .55s 1s both; margin-top:6px; }
  @keyframes pop{ 0%{ transform:scale(.2) rotate(-14deg); opacity:0; } 70%{ transform:scale(1.12) rotate(3deg); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
  .fadein{ animation:fade .5s 1.45s both; }
  @keyframes fade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .reveal h2{ margin:16px 0 4px; font-size:22px; }
  .letterbox{ display:flex; gap:8px; justify-content:center; margin:16px 0; }
  .lb{ width:48px; height:48px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; color:var(--muted); }
  .lb.on{ border-style:solid; border-color:var(--gold); color:var(--gold); box-shadow:0 0 10px rgba(233,180,76,.3); }
  .recap{ text-align:left; background:var(--chip); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:14px; font-size:14px; }
  .recap b{ color:var(--gold); }
  .rline{ margin:4px 0; }

  /* 금고 문 */
  .vaultscene{ perspective:900px; display:flex; justify-content:center; position:relative; height:220px; margin-bottom:6px; }
  .vaultglow{ position:absolute; top:10px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, #ffe9a6 0%, #e9b44c 40%, transparent 72%); animation:glowin 1s 1.1s both; }
  .vaultdoor{ position:relative; width:200px; height:200px; transform-origin:left center; animation:doorswing 1.3s 1.2s ease-in-out forwards; }
  .vaultdoor svg{ width:200px; height:200px; }
  .wheel{ transform-box:view-box; transform-origin:100px 100px; animation:spinwheel 1.1s ease-in-out both; }
  @keyframes spinwheel{ from{ transform:rotate(0); } to{ transform:rotate(540deg); } }
  @keyframes doorswing{ from{ transform:rotateY(0); } to{ transform:rotateY(-78deg); } }
  @keyframes glowin{ from{ opacity:0; transform:scale(.4); } to{ opacity:1; transform:scale(1); } }
  .vaultstatic{ display:flex; justify-content:center; }
  .vaultstatic svg{ width:170px; height:170px; filter:drop-shadow(0 0 22px rgba(232,96,76,.35)); animation:breathe 3s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ filter:drop-shadow(0 0 10px rgba(232,96,76,.2)); } 50%{ filter:drop-shadow(0 0 28px rgba(232,96,76,.6)); } }

  /* 단어 자르기 */
  .cutbox{ display:flex; flex-wrap:wrap; row-gap:30px; column-gap:0; align-items:center; justify-content:center; padding:30px 10px 20px; background:var(--chip); border:1px dashed var(--line); border-radius:16px; }
  .unit{ display:inline-flex; align-items:center; white-space:nowrap; }
  .cell{ min-width:42px; height:56px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; background:var(--panel); border:1.5px solid var(--line); border-radius:10px; }
  .gap{ width:20px; height:56px; border:none; background:transparent; position:relative; cursor:pointer; padding:0; flex:none; }
  .gap::after{ content:''; position:absolute; left:50%; top:6px; bottom:6px; border-left:2px dotted #4a586c; transform:translateX(-50%); }
  .gap:hover::after{ border-left-color:var(--gold); }
  .gap.cut{ width:32px; }
  .gap.cut::after{ border-left:4px solid var(--coral); border-radius:2px; }
  .gap.cut::before{ content:'✂'; position:absolute; top:-18px; left:50%; transform:translateX(-50%) rotate(90deg); font-size:14px; color:var(--coral); }
  .gap.bad::after{ border-left-color:var(--bad); }
  .counter{ margin-top:12px; text-align:center; font-weight:700; color:var(--muted); }
  .counter b{ color:var(--gold); }

  /* 형태 자물쇠 */
  .wgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .wcard{ border:1.5px solid var(--line); border-radius:14px; padding:10px; background:var(--chip); text-align:center; }
  .wcard .w{ font-size:22px; font-weight:900; margin-bottom:8px; }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; font:inherit; font-size:13px; font-weight:700; padding:9px 4px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; }
  .seg button.on[data-v="불변어"]{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .seg button.on[data-v="가변어"]{ background:var(--coral); border-color:var(--coral); color:#fff; }

  /* 분류 자물쇠 */
  .pool{ display:flex; flex-wrap:wrap; gap:8px; padding:12px; min-height:64px; border:1px dashed var(--line); border-radius:14px; background:var(--chip); margin-bottom:14px; align-items:center; }
  .chip{ font:inherit; font-weight:700; font-size:18px; padding:10px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  .chip.sel{ border-color:var(--gold); background:var(--chip-sel); box-shadow:0 0 0 3px rgba(233,180,76,.25); }
  .chip.placed{ font-size:15px; padding:6px 10px; }
  .bins{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .bins.bins9{ grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
  .bin{ border:2px dashed var(--line); border-radius:16px; padding:12px; background:var(--chip); min-height:104px; cursor:pointer; }
  .bins.armed .bin{ border-color:var(--gold); }
  .bn{ font-weight:900; color:var(--gold); font-size:17px; }
  .bd{ font-size:12.5px; color:var(--muted); margin:4px 0 8px; }
  .bchips{ display:flex; flex-wrap:wrap; gap:6px; }
  .split-line{ text-align:center; font-size:18px; font-weight:700; padding:12px; background:var(--chip); border:1px dashed var(--line); border-radius:14px; margin-bottom:12px; }

  /* 암호 */
  .slots{ display:flex; gap:10px; justify-content:center; margin:18px 0; }
  .slot{ width:72px; height:72px; border:2.5px dashed #4a586c; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:900; background:var(--chip); cursor:pointer; }
  .slot.filled{ border-style:solid; border-color:var(--gold); color:var(--gold); box-shadow:0 0 14px rgba(233,180,76,.3); }
  .tiles{ display:flex; gap:10px; justify-content:center; }
  .tile{ width:64px; height:64px; font:inherit; font-size:30px; font-weight:900; border-radius:16px; border:none; background:linear-gradient(145deg,#f7d98a,#d69a24); color:#3a2705; cursor:pointer; }
  .tile.used{ opacity:.2; pointer-events:none; }
  .clue{ text-align:center; background:rgba(233,180,76,.12); border-radius:14px; padding:10px 14px; font-size:15px; }

  /* 분석표 */
  .tbl{ display:grid; gap:10px; margin-top:6px; }
  .trow{ display:grid; grid-template-columns:100px 1fr 1fr 1fr; gap:8px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:14px; background:var(--chip); }
  .trow.head{ font-size:12px; color:var(--muted); border:none; background:none; padding:0 10px; }
  .tw{ font-weight:900; font-size:20px; }
  select{ font:inherit; font-size:15px; padding:10px 8px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); color:var(--ink); width:100%; }
  select.bad{ border-color:var(--bad); background:#ffd9d4; color:#1a1a1a; font-weight:700; }
  select.bad option{ background:#ffd9d4; color:#1a1a1a; }
  @media (max-width:640px){
    .trow{ grid-template-columns:1fr 1fr 1fr; }
    .trow .tw{ grid-column:1/-1; }
    .trow.head{ display:none; }
  }

  /* 시작/결과 */
  .hero{ text-align:center; padding:28px 22px; }
  .hero h1{ font-size:32px; margin:10px 0 6px; text-shadow:0 0 18px rgba(232,96,76,.45); animation:flicker 5s infinite; }
  .hero p{ margin:8px auto; max-width:580px; }
  .steps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:18px 0; text-align:center; }
  .step{ background:var(--chip); border:1px solid var(--line); border-radius:14px; padding:10px 12px; font-size:14px; }
  .step b{ color:var(--gold); }
  input[type="text"]{ font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--chip); color:var(--ink); width:min(320px,100%); text-align:center; }
  .rstats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:18px 0; }
  .rs{ background:var(--chip); border:1px solid var(--line); border-radius:16px; padding:14px 8px; }
  .rs .n{ font-size:26px; font-weight:900; color:var(--gold); }
  .rs .l{ font-size:12px; color:var(--muted); }
  .stars{ font-size:34px; letter-spacing:4px; }
  details{ text-align:left; margin-top:14px; background:var(--chip); border:1px solid var(--line); border-radius:14px; padding:10px 14px; }
  summary{ cursor:pointer; font-weight:700; }
  table.sum{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  table.sum th, table.sum td{ border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }

  /* 단서 노트 */
  .sheet{ position:fixed; inset:0; z-index:150; background:rgba(0,0,0,.72); overflow:auto; padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 24px); display:flex; justify-content:center; align-items:flex-start; }
  .notebook{
    position:relative; width:100%; max-width:640px; padding:22px 20px 20px 34px; border-radius:6px 16px 16px 6px;
    background:repeating-linear-gradient(transparent 0 31px, rgba(90,60,20,.12) 31px 32px), var(--paper);
    border-left:16px solid #7b3f2b; color:var(--paper-ink); font-family:'Gaegu','Noto Sans KR',cursive; font-size:19px; line-height:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.7); animation:memoin .35s ease both;
  }
  .notebook h2{ font-size:26px; color:#8a4a2c; }
  .notebook h3{ font-size:20px; margin:14px 0 2px; color:#8a4a2c; border-bottom:2px solid rgba(138,74,44,.35); }
  .notebook .lb{ border-color:rgba(60,40,10,.35); color:rgba(60,40,10,.4); }
  .notebook .lb.on{ border-color:#b3761a; color:#b3761a; box-shadow:none; }
  .notebook .letterbox{ justify-content:flex-start; margin:8px 0; }
  .notebook .nm{ line-height:26px; margin:6px 0; font-size:17px; }
  .notebook .nm b{ color:#8a4a2c; }
  .notebook .empty{ color:rgba(60,40,10,.5); font-size:17px; }
  .notebook .rline b{ color:#8a4a2c; }
  .notebook textarea{ width:100%; min-height:110px; font:inherit; font-size:19px; line-height:32px; background:transparent; border:1px dashed rgba(90,60,20,.4); border-radius:8px; color:var(--paper-ink); padding:6px 10px; resize:vertical; }
  .notebook .btn{ background:#7b3f2b; color:#fff; border:none; }

  /* 시간 초과 */
  .alarm{ position:fixed; inset:0; z-index:200; background:rgba(45,0,0,.9); display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; overflow:hidden; animation:redflash 1s infinite alternate; }
  .alarm::before{ content:''; position:absolute; inset:-60%; background:conic-gradient(from 0deg, rgba(255,60,60,.55), transparent 16%, transparent 50%, rgba(255,60,60,.55) 50%, transparent 66%); animation:spin 2.2s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes redflash{ from{ background:rgba(45,0,0,.92); } to{ background:rgba(90,0,0,.86); } }
  .alarm .box{ position:relative; max-width:460px; }
  .alarm h1{ font-size:40px; color:#ff6b6b; text-shadow:0 0 22px #ff2b2b; }
  .alarm p{ font-size:16px; }

  '관형사':['수식언','불변어'], '부사':['수식언','불변어'],
  '조사':['관계언','불변어'], '감탄사':['독립언','불변어'],
};
function defaultsFor(mean, w){
  const m = MEAN_MAP[mean]; if (!m) return { func:'', form:'' };
  let form = m[1];
  if (mean === '조사' && /이다$/.test(w)) form = '가변어';   // 서술격 조사 ‘이다’는 형태가 변함

}
// text: 문장, words: [[단어, 의미(품사), (기능), (형태)], ...]
function buildSentence(text, words, hints){
  const clean = text.trim().replace(/\s+/g,' ');
  const eoj = clean.split(' ').filter(Boolean);
  const queue = words.map(x => {
    const d = defaultsFor(x[1], x[0]);
    return { w:x[0], mean:x[1], func:x[2] || d.func, form:x[3] || d.form };
  });

    const chars = [...e.replace(PUNCT,'')];
    let need = chars.length; const ws = [];

      const q = queue[qi];
      if (!q) throw new Error('단어 목록이 문장보다 짧아요.');
      const len = [...q.w].length;
      if (len > need) throw new Error(`‘${q.w}’ 단어가 띄어쓰기를 넘어가요.`);
      ws.push(q.w); need -= len; qi++;
    }

    eojeol.push({ t:e, w:ws });
  }
  if (qi !== queue.length) throw new Error('단어 목록이 문장보다 길어요.');

}
function checkConsistency(words){

    const m = MEAN_MAP[x.mean];
    if (!m) return `‘${x.w}’의 의미(품사)를 골라 주세요.`;
    const d = defaultsFor(x.mean, x.w);

/* ================= 효과음 (WebAudio 합성) ================= */
let AC = null, muted = false;
function ac(){
  if (muted) return null;

    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();

function tone(freq, dur, type, vol, when, slideTo){

  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || .1, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol, when, freq, q){
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (when || 0);
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1500; f.Q.value = q || 1;
  const g = c.createGain(); g.gain.value = vol || .1;
  src.connect(f).connect(g).connect(c.destination); src.start(t0);
}

function cellsOf(e){
  const chars = [...e.t.replace(PUNCT,'')];

  return chars.map((c,i) => i === chars.length-1 ? c+tail : c);
}

  return s;
}

  const req = reqCuts(data);

  const missing = [...req].filter(k => !cut.has(k));
  return { ok: !extra.length && !missing.length, extra:new Set(extra), missing };
}

let state = fresh();
let lastTick = -1;

function elapsedSec(){ return Math.floor((Date.now() - state.start)/1000); }
function stopTimer(){ if (state.timerId){ clearInterval(state.timerId); state.timerId = null; } }
function startTimer(keepStart){
  stopTimer();
  if (!keepStart) state.start = Date.now();
  state.timerId = setInterval(tick, 250);
}
function tick(){
  if (state.screen !== 'play') return;
  const el = document.getElementById('timer'), pill = document.getElementById('timepill');
  const e = elapsedSec();
  if (state.practice){ if (el) el.textContent = fmt(e); return; }
  const rem = LIMIT - e;
  if (rem <= 0){ onTimeout(); return; }
  if (el) el.textContent = fmt(rem);
  if (pill) pill.classList.toggle('danger', rem <= 180);
  if (rem <= 10 && rem !== lastTick){ lastTick = rem; SFX.tick(); }
}
function onTimeout(){
  stopTimer(); state.timedOut = true; state.timeout = true; state.notebook = false;
  SFX.alarm(); render();
}
function hintKey(){ return state.stage === 'scan' ? (state.scan.step === 'cut' ? 'scanCut' : 'scanTable') : state.stage; }
function goMemo(key){
  state.stage = key; state.memo = key;
  if (!state.memosSeen.includes(key)) state.memosSeen.push(key);
}

const MEAN_LIST = Object.keys(MEAN_MAP);
const FUNC_LIST = ['체언','용언','수식언','관계언','독립언'];
const b64enc = str => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
const b64dec = code => new TextDecoder().decode(Uint8Array.from(atob(code.replace(/\s+/g,'')), ch => ch.charCodeAt(0)));
const sanitize = t => t.replace(/[^\uAC00-\uD7A3ㄱ-ㅎㅏ-ㅣA-Za-z0-9\s,.!?~…]/g,'').replace(/\s+/g,' ').trim();

function edCells(text){ return flatCells({ eojeol: text.trim().split(/\s+/).filter(Boolean).map(t => ({t})) }); }
function edForced(text){
  const set = new Set(); let acc = 0;
  const eoj = text.trim().split(/\s+/).filter(Boolean);
  eoj.forEach((e,i) => { acc += [...e.replace(PUNCT,'')].length; if (i < eoj.length-1) set.add(String(acc-1)); });
  return set;
}
function edWords(text, cut){
  const cells = edCells(text), out = []; let cur = '';
  cells.forEach((c,i) => { cur += c.replace(PUNCT,''); if (i === cells.length-1 || cut.has(String(i))){ out.push(cur); cur = ''; } });
  return out;
}
function edSync(ed){
  const words = edWords(ed.text, ed.cut), old = ed.rows;
  ed.rows = words.map((w,i) => (old[i] && old[i].w === w) ? old[i] : { w, mean:'', func:'', form:'' });
}
function edFromSentence(sn){
  const ed = { draft:sn.text, text:sn.text, cut:reqCuts(sn), rows:sn.words.map(x => ({ w:x.w, mean:x.mean, func:x.func, form:x.form })), msg:null };
  return ed;
}
function edEmpty(){ return { draft:'', text:'', cut:new Set(), rows:[], msg:null }; }
function edCommit(ed){
  if (!ed.text.trim()) throw new Error('문장을 입력하고 [문장 적용]을 눌러 주세요.');
  if (ed.rows.length < 3) throw new Error('단어가 3개 이상이 되도록 나눠 주세요.');
  const bad = ed.rows.find(r => !r.mean || !r.func || !r.form);
  if (bad) throw new Error(`‘${bad.w}’의 의미·기능·형태를 모두 골라 주세요.`);
  const inc = checkConsistency(ed.rows);
  if (inc) throw new Error(inc);
  return buildSentence(ed.text, ed.rows.map(r => [r.w, r.mean, r.func, r.form]));
}
function edStatus(ed){ try { edCommit(ed); return { ok:true }; } catch(e){ return { ok:false, msg:e.message }; } }

let ED = { tab:'main', main:edFromSentence(SET.main), scan:edFromSentence(SET.scan), codeOut:'', codeIn:'', importMsg:null, saveName:'', note:null };

function encodeSet(main, scan){
  const pack = sn => ({ t:sn.text, w:sn.words.map(x => [x.w, x.mean, x.func, x.form]) });
  return b64enc(JSON.stringify({ v:1, m:pack(main), s:pack(scan) }));
}
function decodeSet(code){
  let o; try { o = JSON.parse(b64dec(code)); } catch(e){ throw new Error('세트 코드를 읽을 수 없어요. 코드를 통째로 붙여 넣었는지 확인해 주세요.'); }
  if (!o || o.v !== 1 || !o.m || !o.s) throw new Error('지원하지 않는 세트 코드예요.');
  const mk = p => { const sn = buildSentence(p.t, p.w); const inc = checkConsistency(sn.words); if (inc) throw new Error(inc); return sn; };
  return { main:mk(o.m), scan:mk(o.s) };
}

function storeSaved(list){ try { localStorage.setItem('chae_pos_sets', JSON.stringify(list)); return true; } catch(e){ return false; } }

/* ================= 동작 ================= */
function setMsg(text, kind){ state.msg = {text, kind}; }
function toTop(){ window.scrollTo({top:0, behavior:'auto'}); }
function fail(){ state.wrong++; SFX.wrong(); }

function unlock(key){
  state.done[key] = true;
  state.letters.push(LETTERS[key]);
  const nextMap = { l1:'l2', l2:'l3', l3:'l4', l4:'code' };
  let recap = '', title = '';
  if (key === 'l1'){ title = '1번 · 단어 나누기'; recap = `<div class="rline"><b>단어</b> : ${splitLine(SET.main.words)}</div>`; }
  if (key === 'l2'){ title = '2번 · 형태'; recap = `<div class="rline"><b>가변어</b> : ${SET.main.words.filter(x=>x.form==='가변어').map(x=>esc(x.w)).join(', ')}</div><div class="rline"><b>불변어</b> : ${SET.main.words.filter(x=>x.form==='불변어').map(x=>esc(x.w)).join(', ')}</div>`; }
  if (key === 'l3'){ title = '3번 · 기능'; recap = groupRecap('func', FUNC_BINS.map(b=>b.name)); }
  if (key === 'l4'){ title = '4번 · 의미'; recap = groupRecap('mean', MEAN_BINS.map(b=>b.name)); }
  state.recaps[key] = `<div><b>${title}</b></div>${recap}`;
  const no = {l1:1,l2:2,l3:3,l4:4}[key];
  state.reveal = { kind:'lock', big:LETTERS[key], title:`${no}번 자물쇠 열림!`, text:`비밀 글자 ‘${LETTERS[key]}’를 얻었어요. 단서 노트에도 기록했어요.`,
    showLetters:true, recap, goto:nextMap[key], nextLabel: key==='l4' ? '금고 문 앞으로 ▶' : '다음 쪽지 읽기 ▶' };
  state.msg = null;
  SFX.clank(); setTimeout(SFX.chime, 520);
  render(); toTop();
}

const actions = {
  start(){
    const t = document.getElementById('team');
    state.team = t ? t.value.trim() : '';
    state.screen = 'play'; goMemo('l1');
    lastTick = -1; startTimer(false); SFX.rumble(); render(); toTop();
  },
  mute(){ muted = !muted; if (!muted) SFX.tap(); render(); },
  notebook(){ state.notebook = true; SFX.page(); render(); },
  'close-notebook'(){ state.notebook = false; SFX.page(); render(); },
  'close-notebook-bg'(el, ev){ if (ev.target === el){ state.notebook = false; render(); } },
  'read-memo'(){ state.memo = null; SFX.page(); render(); toTop(); },
  gap(el){
    const isScan = state.stage === 'scan';
    const set = isScan ? state.scan.cut : state.cut1, k = el.dataset.k;
    if (set.has(k)){ set.delete(k); SFX.tap(); } else { set.add(k); SFX.snip(); }
    if (isScan) state.scan.badCut = null; else state.badCut = null;
    render();
  },
  'clear-cut'(el){
    if (el.dataset.scope === 'scan'){ state.scan.cut.clear(); state.scan.badCut = null; }
    else { state.cut1.clear(); state.badCut = null; }
    SFX.tap(); render();
  },
  'check-l1'(){
    const r = checkCut(SET.main, state.cut1);
    if (r.ok) return unlock('l1');
    fail(); state.badCut = r.extra;
    const parts = [];
    if (r.extra.size) parts.push(`잘못 나눈 곳이 ${r.extra.size}군데 있어요(빨간 선).`);
    if (r.missing.length) parts.push('아직 더 나눠야 할 곳이 있어요.');
    setMsg(parts.join(' '), 'bad'); render();
  },
  hint(){
    const k = hintKey();
    const used = state.hintIdx[k] || 0;
    if (used < getHints(k).length){
      state.hintIdx[k] = used+1; state.hints++;
      state.hintLog.push({ label:HINT_LABEL[k], text:getHints(k)[used] });
      SFX.chime();
    }
    render();
  },
  form(el){ state.form2[el.dataset.i] = el.dataset.v; SFX.tap(); render(); },
  'check-l2'(){
    const wrong = SET.main.words.filter((x,i) => state.form2[i] !== x.form).length;
    if (!wrong) return unlock('l2');
    fail(); setMsg(`${wrong}개의 단어가 알맞은 서랍에 있지 않아요. 다시 살펴봐요!`, 'bad'); render();
  },
  pick(el){
    const st = el.dataset.k === 'l3' ? state.s3 : state.s4;
    const i = Number(el.dataset.i);
    st.sel = st.sel === i ? null : i; SFX.tap(); render();
  },
  place(el){
    const st = el.dataset.k === 'l3' ? state.s3 : state.s4;
    if (st.sel === null){ setMsg('먼저 위에서 단어를 하나 탭해 주세요.', 'warn'); render(); return; }
    st.place[st.sel] = el.dataset.bin; st.sel = null; SFX.tap(); render();
  },
  unplace(el){
    const st = el.dataset.k === 'l3' ? state.s3 : state.s4;
    delete st.place[Number(el.dataset.i)]; st.sel = null; SFX.tap(); render();
  },
  'check-sorter'(el){
    const key = el.dataset.k, st = key === 'l3' ? state.s3 : state.s4, field = key === 'l3' ? 'func' : 'mean';
    const wrong = SET.main.words.map((_,i)=>i).filter(i => st.place[i] !== SET.main.words[i][field]);
    if (!wrong.length) return unlock(key);
    fail(); wrong.forEach(i => delete st.place[i]); st.sel = null;
    setMsg(`${wrong.length}개의 단어가 제자리가 아니라서 되돌아왔어요. 다시 생각해 봐요!`, 'bad'); render();
  },
  tile(el){
    const i = Number(el.dataset.i), slots = state.code.slots;
    if (slots.includes(i)) return;
    const s = slots.indexOf(null); if (s === -1) return;
    slots[s] = i; SFX.tap(); render();
  },
  slot(el){ state.code.slots[Number(el.dataset.s)] = null; SFX.tap(); render(); },
  'check-code'(){
    const word = state.code.slots.map(i => state.letters[i]).join('');
    if (word !== CODE){ fail(); setMsg('암호가 맞지 않아요. 글자의 순서를 바꿔 보세요!', 'bad'); render(); return; }
    state.done.code = true;
    state.recaps.code = `<div><b>암호</b> : ${esc(CODE)}</div>`;
    state.reveal = { kind:'vault', big:'🚪', title:'암호 일치!', text:'바퀴가 돌아가며 금고 문이 열려요. 그런데 안쪽에 마지막 보안 장치가 있어요. 새 문장을 정확히 분석해야 통과할 수 있어요.',
      showLetters:false, recap:`<div class="rline"><b>암호</b> : ${esc(CODE)}</div>`, goto:'scan', nextLabel:'보안 장치로 ▶' };
    state.msg = null; SFX.rumble(); setTimeout(SFX.clank, 1300); setTimeout(SFX.chime, 1500); render(); toTop();
  },
  'check-scan-cut'(){
    const r = checkCut(SET.scan, state.scan.cut);
    if (r.ok){ state.scan.step = 'table'; state.scan.badCut = null; state.msg = null; SFX.clank(); render(); toTop(); return; }
    fail(); state.scan.badCut = r.extra;
    const parts = [];
    if (r.extra.size) parts.push(`잘못 나눈 곳이 ${r.extra.size}군데 있어요(빨간 선).`);
    if (r.missing.length) parts.push('아직 더 나눠야 할 곳이 있어요.');
    setMsg(parts.join(' '), 'bad'); render();
  },
  'check-table'(){
    const t = state.scan.table, bad = new Set();
    let missing = false;
    SET.scan.words.forEach((w,i) => { const r = t[i] || {};
      ['form','func','mean'].forEach(f => { if (!r[f]) missing = true; else if (r[f] !== w[f]) bad.add(i+'-'+f); });
    });
    if (missing){ setMsg('아직 고르지 않은 칸이 있어요.', 'warn'); state.scan.bad = null; render(); return; }
    if (bad.size){
      fail(); state.scan.bad = bad;
      setMsg(`${bad.size}칸이 맞지 않아요. 빨간 칸을 다시 살펴봐요!`, 'bad'); render(); return;
    }
    state.done.scan = true; state.end = Date.now(); stopTimer();
    state.screen = 'result'; state.msg = null; SFX.clank(); setTimeout(SFX.win, 400); render(); toTop();
  },
  next(){
    const r = state.reveal; state.reveal = null; state.msg = null; goMemo(r.goto); SFX.page(); render(); toTop();
  },
  practice(){
    state.timeout = false; state.practice = true; startTimer(true); SFX.tap(); render();
  },
  restart(){
    const team = state.team; stopTimer(); state = fresh(team); lastTick = -1; render(); toTop();
  },
};


Object.assign(actions, {
  'teacher-toggle'(){ state.teacher = !state.teacher; render(); },
  editor(){
    const t = document.getElementById('team'); if (t) state.team = t.value.trim();
    ED.main = edFromSentence(SET.main); ED.scan = edFromSentence(SET.scan); ED.tab = 'main'; ED.note = null;
    state.screen = 'editor'; SFX.page(); render(); toTop();
  },
  'ed-tab'(el){ ED.tab = el.dataset.k; render(); },
  'ed-gap'(el){
    const ed = ED[ED.tab], k = el.dataset.k;
    ed.cut.has(k) ? ed.cut.delete(k) : ed.cut.add(k);
    edSync(ed); SFX.snip(); render();
  },
  'ed-load-default'(){
    const sn = defaultSet()[ED.tab];
    ED[ED.tab] = edFromSentence(sn); SFX.tap(); render();
  },
  'ed-apply-text'(){
    const ed = ED[ED.tab], t = sanitize(ed.draft || '');
    if (!t){ ed.msg = { kind:'warn', text:'문장을 입력해 주세요.' }; render(); return; }
    if ([...t.replace(/\s/g,'')].length > 60){ ed.msg = { kind:'warn', text:'문장이 너무 길어요. 60글자 이하로 줄여 주세요.' }; render(); return; }
    ed.text = t; ed.draft = t; ed.cut = edForced(t); ed.rows = []; edSync(ed);
    ed.msg = null; SFX.tap(); render();
  },
  'ed-apply'(){
    let main, scan;
    try { main = edCommit(ED.main); }
    catch(e){ ED.tab = 'main'; ED.note = { kind:'bad', text:`적용할 수 없어요 (자물쇠 1~4번 문장): ${e.message}` }; render(); return; }
    try { scan = edCommit(ED.scan); }
    catch(e){ ED.tab = 'scan'; ED.note = { kind:'bad', text:`적용할 수 없어요 (보안 장치 문장): ${e.message}` }; render(); return; }
    SET = { main, scan };
    state = fresh(state.team); ED.note = null; SFX.chime(); render(); toTop();
  },
  'ed-back'(){ state.screen = 'intro'; render(); toTop(); },
  'ed-reset'(){
    SET = defaultSet(); ED.main = edFromSentence(SET.main); ED.scan = edFromSentence(SET.scan);
    ED.note = { kind:'ok', text:'기본 문장으로 되돌렸어요.' }; ED.codeOut = ''; render();
  },
  'ed-code'(){
    try { ED.codeOut = encodeSet(edCommit(ED.main), edCommit(ED.scan)); ED.note = { kind:'ok', text:'세트 코드를 만들었어요. 아래 코드를 복사해서 전달하세요.' }; }
    catch(e){ ED.codeOut = ''; ED.note = { kind:'bad', text:`코드를 만들 수 없어요: ${e.message}` }; }
    render();
  },
  async 'ed-copy'(){
    const ta = document.getElementById('codeout'); if (!ta) return;
    let ok = false;
    try { await navigator.clipboard.writeText(ED.codeOut); ok = true; } catch(e){ try { ta.select(); ok = document.execCommand('copy'); } catch(e2){} }
    ED.note = ok ? { kind:'ok', text:'코드를 복사했어요!' } : { kind:'warn', text:'복사가 막혀 있어요. 코드 칸을 길게 눌러 직접 복사해 주세요.' };
    render();
  },
  'ed-save'(){
    const name = (ED.saveName || '').trim() || '이름 없는 세트';
    try {
      const code = encodeSet(edCommit(ED.main), edCommit(ED.scan));
      const list = loadSaved().filter(x => x.name !== name); list.push({ name, code });
      ED.note = storeSaved(list) ? { kind:'ok', text:`‘${name}’ 세트를 이 기기에 저장했어요.` } : { kind:'warn', text:'이 기기에는 저장할 수 없어요. 세트 코드로 보관해 주세요.' };
    } catch(e){ ED.note = { kind:'bad', text:`저장할 수 없어요: ${e.message}` }; }
    render();
  },
  'ed-load-saved'(el){
    const item = loadSaved()[Number(el.dataset.i)]; if (!item) return;
    try { const set = decodeSet(item.code); ED.main = edFromSentence(set.main); ED.scan = edFromSentence(set.scan); ED.note = { kind:'ok', text:`‘${item.name}’ 세트를 불러왔어요. [적용하고 시작 화면으로]를 눌러 주세요.` }; }
    catch(e){ ED.note = { kind:'bad', text:e.message }; }
    render();
  },
  'ed-del-saved'(el){ const list = loadSaved(); list.splice(Number(el.dataset.i), 1); storeSaved(list); render(); },
  'ed-import'(){
    try { const set = decodeSet(ED.codeIn || ''); ED.main = edFromSentence(set.main); ED.scan = edFromSentence(set.scan); ED.note = { kind:'ok', text:'세트를 불러왔어요. [적용하고 시작 화면으로]를 눌러 주세요.' }; }
    catch(e){ ED.note = { kind:'bad', text:e.message }; }
    render();
  },
  'import-code'(){
    try { const set = decodeSet(ED.codeIn || ''); SET = set; state = fresh(state.team); ED.main = edFromSentence(SET.main); ED.scan = edFromSentence(SET.scan); ED.importMsg = { kind:'ok', text:'선생님이 만든 문장으로 바뀌었어요!' }; SFX.chime(); }
    catch(e){ ED.importMsg = { kind:'bad', text:e.message }; }
    render();
  },
});

app.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'teacher-toggle') return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (!['start','mute','notebook','close-notebook','close-notebook-bg'].includes(el.dataset.act) && !el.dataset.act.startsWith('ed-') && el.dataset.act !== 'import-code' && el.dataset.act !== 'editor') state.msg = null;
  fn(el, ev);
});
app.addEventListener('dblclick', ev => {
  const el = ev.target.closest('[data-act="teacher-toggle"]');
  if (el) actions['teacher-toggle']();
});
app.addEventListener('change', ev => {
  const edSel = ev.target.closest('select[data-ed]');
  if (edSel){
    const ed = ED[ED.tab], i = Number(edSel.dataset.ed), f = edSel.dataset.f, r = ed.rows[i];
    if (r){
      r[f] = edSel.value;
      if (f === 'mean'){ const d = edSel.value ? defaultsFor(edSel.value, r.w) : { func:'', form:'' }; r.func = d.func; r.form = d.form; }
      render();
    }
    return;
  }
  const sel = ev.target.closest('select[data-tbl]');
  if (!sel) return;
  const i = Number(sel.dataset.tbl), f = sel.dataset.f;
  state.scan.table[i] = state.scan.table[i] || {};
  state.scan.table[i][f] = sel.value;
  sel.classList.remove('bad');
});
app.addEventListener('input', ev => {
  const id = ev.target.id;
  if (id === 'notes') state.notes = ev.target.value;
  else if (id === 'ed-text') ED[ED.tab].draft = ev.target.value;
  else if (id === 'savename') ED.saveName = ev.target.value;
  else if (id === 'codein' || id === 'codein-ed') ED.codeIn = ev.target.value;
});
app.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'team') actions.start();
  if (ev.key === 'Enter' && ev.target.id === 'ed-text') actions['ed-apply-text']();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && state.notebook){ state.notebook = false; render(); }
});

render();
</script>
